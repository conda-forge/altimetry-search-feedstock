schema_version: 1

context:
  version: "2.0.0"
  python_min: "3.11"

package:
  name: altimetry-search
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/altimetry-search/altimetry_search-${{ version }}.tar.gz
  sha256: cce300304fda8a6e86976e1fa8776c074be7a361b2450791d8d486fa5a5d9bb0

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - pandas
    - pyinterp
    - xarray

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - altimetry.search
      pip_check: true

about:
  summary: Orbit pass search API for SWOT altimetry (GUI-free subset of altimetry-search)
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/altimetry-search/

extra:
  recipe-maintainers:
    - annesophie-cls
